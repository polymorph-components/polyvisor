<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TodoMVC — polymorph wasm→DOM spike</title>
  <link rel="stylesheet" href="todomvc-app.css">
  <!-- The visor's shared system-UI chrome AND its sheets' styling
       (strip, clusters, drawer host, .cred-sheet/.name-sheet/
       .settings-sheet): visor/ui/visor.css, the same stylesheet the demo
       spike links (#22/#20). It is the only stylesheet the visor needs —
       this page registers the framework's own naming and settings sheets
       (visor/ui/sheets.ts) and adds no sheet markup or CSS of its own.
       Linked BEFORE this page's own <style> block, matching the demo's
       cascade order. -->
  <link rel="stylesheet" href="./visor.css">
  <style>
    :root { --content-max: 40rem; }
    .bar-inner { max-width: var(--content-max); margin: 0 auto; width: 100%;
                 box-sizing: border-box; }
    /* todomvc-app.css clamps <body> to a centered 550px column (the
       classic app look). The visor's strip must not be clamped with it:
       position is a trust anchor, and a strip that stops where the app
       column stops reads as part of the app. Full-bleed breakout — the
       zone escapes the body clamp and spans the viewport; its own
       .bar-inner recenters the content. */
    #visor-zone { margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
  </style>
</head>
<body data-page="demo">
  <!-- The shared visor skeleton (visor/ui/visor.ts's fixed ids — see
       spikes/demo/web/index.html, mirrored here verbatim). -->
  <div id="visor-zone">
    <div id="visor-drawer" hidden><div id="visor-drawer-inner"></div></div>
    <div id="visor-strip">
      <div class="bar-inner">
        <span id="visor-context">
          <span class="ctx-top"></span>
          <span class="ctx-bottom"></span>
        </span>
        <span id="visor-identity"></span>
      </div>
    </div>
  </div>
  <div id="visor-dim" hidden></div>
  <div id="app">loading…</div>
  <footer class="info">
    <p>Double-click (or double-tap) to edit a todo</p>
    <p>
      App logic is a <strong>wasm component</strong> driving a curated DOM
      surface — no app JS, no app HTML
      (<a href="https://github.com/polymorph-components/polyvisor/issues/16">design</a>).
    </p>
    <p>
      Runs on <a href="https://github.com/polymorph-components/polyengine">deltic</a> —
      <a href="https://github.com/polymorph-components/polyvisor/tree/main/spikes/todomvc">source</a>
    </p>
    <p>
      <span id="backend-note"></span><br>
      backends: <a href="?backend=frame">frame</a> ·
      <a href="?backend=direct">direct</a> ·
      <a href="?backend=queued">queued</a> ·
      <a href="?backend=channel">channel</a><br>
      guests: <a href="?guest=hand">hand-written</a> ·
      <a href="?guest=dioxus">dioxus</a> ·
      <a href="?guest=preact">preact</a> —
      <a href="harness.html">equivalence harness</a> ·
      <a href="bench.html">bench</a>
    </p>
  </footer>
  <script type="module" src="app.js"></script>
</body>
</html>
