[package]
name = "visor-spike"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The sibling renderer checkout. Path is relative and assumes polyvisor and
# polyengine-dioxus are siblings under ~/p/polymorph — which is true of the
# canonical checkout, and NOT true inside a git worktree (a worktree sits at
# ~/.paseo/worktrees/<id>/<name>, six levels down). See the spike report: a
# symlink next to the worktree restores the invariant; there is no
# cargo-native way to express "the sibling of my repo root".
#
# NO `eval` FEATURE, AND NO `dioxus/document` EITHER. The reason is a
# measurement, not a policy — and the measurement went the other way from the
# expectation that turned it on.
#
# It was enabled on the belief that `visor/ui/pairing.ts:133-144`'s 2D canvas
# was the one thing in the whole of visor/ui/ that a DOM-mutation surface could
# not express. Ported, it turned out a 79-char join code is a 37-module symbol
# reducing to 362 row-wise runs — one `<path>`, two DOM nodes, 26.5ms from
# `request-join()` to painted, and it decodes back to the same code under a
# real scanner. So the capability's one suspected customer did not need it.
#
# Retiring it bought back ~37 KB gzipped — about 70% of what the entire
# 1,866-line sheets.ts port cost — for a capability that reaches the page's own
# realm. That is a good trade in a trusted computing base, and re-enabling it
# is one feature flag on the day something demonstrates a need.
#
# It was turned on for ONE customer: `visor/ui/pairing.ts:133-144` builds the
# pairing QR on a 2D canvas and returns a `toDataURL` PNG, which looked like the
# one thing in all of visor/ui/ that a DOM-mutation surface could not express.
# The pairing wave ported it, measured it, and found otherwise — a QR is a grid
# of axis-aligned rectangles, which is what a vector format is for. It is now a
# single SVG `<path>`: two nodes, one attribute, no host round trip. See
# `src/pairing/pure/qr.rs`'s header.
#
# So the capability had one customer and the customer did not need it. Dropping
# it is not merely a size win: the visor is the trusted computing base, and
# `eval` reaches the page's own realm — `globalThis`, `document`, and through
# them every other thing on the origin, including the localStorage that
# `interface store`'s slot enum exists to keep out of this component's reach
# (wit/world.wit:64-75 says exactly this about what must never migrate onto
# eval). A capability that wide is carried for a demonstrated need, not a
# suspected one.
#
# WHAT TURNING IT BACK ON WOULD TAKE: this feature, plus the `with:` mapping in
# `src/component.rs`'s `generate!`, plus `MountOptions.eval` on the host. It is
# a two-sided opt-in and a component built with only one side fails to
# instantiate, which is the loud, safe direction.
polyengine-dioxus = { path = "../../../polyengine-dioxus" }

# Pins mirrored EXACTLY from the sibling's Cargo.toml. dioxus-core is shared
# state between this crate and the renderer (we hand it a `fn() -> Element`);
# a version skew would compile two incompatible copies and fail at the
# `driver::run(App)` call site.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }
dioxus = { version = "=0.7.10", default-features = false, features = [
  "macro",
  "html",
  "signals",
  "hooks",
] }

# THE QR ENCODER, for the join flow's code (`visor/ui/pairing.ts:130-145`).
#
# A REVIEWED DEPENDENCY RATHER THAN A HAND-PORT. The TypeScript vendors
# `visor/ui/vendor/qrcodegen.ts` — 997 lines of Nayuki's reference encoder
# copied into the tree — because adding an npm dependency for one image was
# judged the worse trade there. That trade inverts here: this crate is trusted
# UI, so everything in it is in the TCB, and 997 lines of hand-copied
# Reed-Solomon that no one on this project will ever re-review is a worse thing
# to have in a TCB than a crates.io package with a version, a checksum and
# other people reading it. Nothing secret is encoded either way — a pairing
# code is a public offer whose whole security rests on the SAS comparison the
# two humans make, not on the code's confidentiality — so an encoder bug is a
# QR that fails to scan, not a leak.
#
# `default-features = false` drops `image`, `svg` and `pic`: only the matrix is
# wanted here (`QrCode::width`/`to_vec`), because the rasterisation is the
# renderer's job. See `src/pairing/qr.rs`.
qrcode = { version = "0.14.1", default-features = false }

# THE CLOCK. `wasm32-wasip2` has no JavaScript host to call `setTimeout` on,
# and `dioxus-sdk-time`'s stock wasm backend reaches `setTimeout` through
# wasm-bindgen — whose imports are only resolvable on `wasm32-unknown-unknown`
# with the wasm-bindgen CLI in the pipeline, so on this target they compile to
# stubs that abort the instance when called. The fork's `wasip3` feature waits
# on `wasi:clocks/monotonic-clock` instead, which keeps the timing path inside
# the component model and inside an interface the host already serves
# (../../../polyengine-dioxus/.deps/polyengine/wasi/src/clocks.ts).
#
# The pin is the SIBLING'S, verbatim: polyengine-dioxus/Cargo.toml:43-55. A rev
# and not a branch, for the reason stated there — it is a fork we can push to,
# so a branch reference would let a push silently change what everyone builds.
[patch.crates-io]
dioxus-sdk-time = { git = "https://github.com/lannbot/dioxus-sdk", rev = "390acec245754a3ad54217a0b625ff121d2c95f2" }

# WASM-ONLY, deliberately. The crate's non-wasm backend is `tokio::time`, and
# the whole point of the `state`/`drawer`/`voice` split is that `cargo test`
# runs the state machines on the host with no runtime underneath them — the
# arming delay is TESTED there by driving the machine's timer edge directly
# (`DrawerState::arm_elapsed`), which is what makes the delay's RULES checkable
# without a clock at all. The clock itself is only ever needed by `component`,
# which is wasm-only for the same reason.
#
# The `wasip3` feature has to be switched on by a crate in the graph, which is
# why the crate is named here rather than merely inherited: the workspace patch
# above redirects it to the fork that has the feature, and this turns it on.
[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus-sdk-time = { version = "0.7.0", features = ["wasip3"] }

[workspace]


[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
