# Continuous deployment of the demo site to GitHub Pages.
#
# The site was previously BUILT ON A LAPTOP and committed: every rebuild
# added an ~11 MB engine composite to git history, and "keep Pages
# updated" was a manual step that could silently drift from the source.
# Here the artifact is built from the source tree on every push instead,
# so the deployed demo is always the committed spike.
#
# Build runs on PRs too (a broken demo build should fail the PR, not the
# deploy); only main deploys.
#
# Cutover history (staged deliberately; completed 2026-08-18): (1) the
# workflow landed with the committed site left in place, and its first
# main run deployed successfully — provable from the served build stamp,
# which carried the merge commit's rev, something only this workflow's
# rebuild could produce; (2) the Pages source was switched to "GitHub
# Actions", removing the race between the legacy branch build and this
# deploy; (3) docs/demo/ was deleted from git and ignored — it is
# generated by `just pages` below (the checkout does not contain it; the
# artifact upload reads the working tree, so gitignore is irrelevant to
# what deploys).

name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One deploy at a time; a superseded run is cancelled rather than
  # racing another deployment of the same site.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The engine composite pulls keyhive + subduction + automerge from
    # source; a cold cache is a long build.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Deno (the polyengine host; stock, no flags)
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.9.5"

      - name: Check out pinned siblings
        # Before the cache restore: rust-cache keys on the listed
        # workspaces' lockfiles. This phase is cheap (blob-less clones,
        # no cargo).
        run: SIBLINGS_ONLY=1 ./scripts/setup.sh

      - name: Cache cargo
        # Restored BEFORE any cargo work: setup.sh builds sibling
        # dependencies, so the restore has to precede it, not just
        # precede `just pages`.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            examples/todomvc/guest
            providers/s3/panel
            providers/dropbox/panel
            runtime/device-seal
          # No registry pruning: the sibling workspace sits outside the
          # repo, and its deps must survive the post-job save.
          cache-all-crates: true
          # Tools are binstalled in seconds; a cached bin/ would roll
          # pinned tools back to whatever versions the cache holds.
          cache-bin: false
          # One cache entry shared with the E2E workflow: shared-key
          # REPLACES rust-cache's default job-id key component (and the
          # `key` input, which is ignored when shared-key is set — the
          # rotation hash lives here instead). Without it, rust-cache
          # baked the JOB id into the key ("build" here, "e2e" there), so
          # E2E could never restore the entry this job saves and ran a
          # cold cargo build every time.
          #
          # Sibling pins and tool versions live in setup.sh, the pinned
          # compilers in rust-toolchain.toml; bumping either must rotate
          # the key or stale target dirs get restored forever.
          shared-key: demo-${{ hashFiles('scripts/setup.sh', '**/rust-toolchain.toml') }}
          # Save only on main: PR jobs restore but never save, so PR
          # branches don't churn the cache entries every run depends on.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Set up tools and the endpoint component
        # Same script developers run: the toolchain from
        # rust-toolchain.toml, wasm-tools/wac/just binstalled at pinned
        # versions, the sibling endpoint built. Siblings are already
        # pinned; the phase above is idempotent under re-run.
        run: ./scripts/setup.sh
        # cargo-binstall resolves releases through api.github.com;
        # unauthenticated requests share a 60/hour per-IP limit that pooled
        # runner IPs exhaust. The token moves it to the per-token limit.
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build the demo site
        working-directory: demo
        run: just pages

      - name: Assemble the site
        # docs/ is the site root: docs/index.html is the only committed
        # build; docs/demo is the one this workflow rebuilds.
        run: |
          test -f docs/demo/engine.component.wasm
          test -f docs/demo/panel-dropbox.component.wasm
          test -f docs/demo/solo.html
          test -f docs/demo/solo-worker.js
          test -f docs/index.html
          du -sh docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    # Only the default branch deploys; PR builds stop at the artifact.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
