# Builds and deploys web/dist to GitHub Pages. Toolchain setup steps kept
# in sync with ci.yml manually (see that file's header comment).
name: pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools,just,wac-cli
      - uses: Swatinem/rust-cache@v2
      # `site` composes first: the shipped runtime is the wac-plugged
      # artifact (justfile `compose`), and a dist built from the bare one
      # fails loudly in web/build.ts.
      - run: just build-wasm site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
