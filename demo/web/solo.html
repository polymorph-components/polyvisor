<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>polymorph — one device</title>
  <!-- Same discipline as index.html: todomvc-app.css is loaded by
       frame.html INSIDE the app frame, never on the shell document. -->
  <style>
    body { margin: 0; background: #f5f5f5; font: 14px 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    :root { --content-max: 46rem; }
    .bar-inner { max-width: var(--content-max); margin: 0 auto; width: 100%;
                 box-sizing: border-box; }
  </style>
  <link rel="stylesheet" href="./visor.css">
  <style>
    #banner { padding: .6em 0; background: #1a1a2e; color: #eee; font-size: 13px; }
    #banner .bar-inner { padding: 0 1em; box-sizing: border-box; }
    #page { max-width: var(--content-max); margin: 0 auto; width: 100%;
            box-sizing: border-box; padding: 12px; }
    #solo-status { font-size: 11px; color: #777; margin: 4px 0; min-height: 1.4em;
                   font-family: ui-monospace, monospace; word-break: break-all; }
    #solo-app { margin-top: 8px; }
  </style>
</head>
<body>
  <!-- The visor assembly, identical in SHAPE to index.html's: the ids are
       part of the visor's contract (visor/ui/visor.ts's `initVisor` looks
       them up by name and says so), not page decoration, so a second
       embedder reproduces them exactly rather than inventing its own. -->
  <div id="visor-zone">
    <div id="visor-drawer" hidden><div id="visor-drawer-inner"></div></div>
    <div id="visor-strip">
      <div class="bar-inner">
        <span id="visor-context">
          <span class="ctx-top"></span>
          <span class="ctx-bottom"></span>
        </span>
        <span id="visor-identity"></span>
      </div>
    </div>
  </div>
  <div id="visor-dim" hidden></div>
  <div id="banner"><div class="bar-inner">booting…</div></div>
  <!-- WHAT IS NOT HERE ANY MORE, and why it left. The device picker, the
       fork an account-less device offers, and the join pane used to be
       markup right here, below the strip, in this page's own light
       chrome. They are the visor's own drawer sheets now
       (visor/ui/entry.ts), built in TS and mounted above the pinned bar
       over a dimmed page.

       The rule they were breaking is the one a user can actually learn:
       identity, account and ceremony UI appears ONLY in visor territory.
       A card sitting in page flow is indistinguishable in kind from
       anything a component could paint inside its own rectangle — while
       a sheet attached to the pinned strip, with the page dimmed around
       it, is something a framed component structurally cannot produce.
       The picker in particular gains nothing personal by moving: it
       still renders before the seal opens, on the visor's UNCLAIMED grey
       dress (visor.css's zero-chroma fallback), carrying index content
       and nothing else (runtime/PERSISTENCE.md, "The index: what may
       exist before unseal").

       So this page keeps only its OWN furniture: the boot banner, the
       status line, and the frame the app mounts into. -->
  <div id="page">
    <div class="status" id="solo-status">…</div>
    <div id="solo-app"></div>
  </div>
  <meta name="pm-build" content="__BUILD__">
  <script type="module" src="./solo.js?v=__BUILD__"></script>
</body>
</html>
