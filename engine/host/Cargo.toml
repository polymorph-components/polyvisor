[package]
name = "engine-host"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Must match polymorph-webcrypto-wasmtime's wasmtime major.
wasmtime = { version = "47", features = ["component-model", "component-model-async", "async", "cranelift", "runtime"] }
wasmtime-wasi = { version = "47", features = ["p3"] }
wasmtime-wasi-http = { version = "47", features = ["p3"] }
polymorph-webcrypto-wasmtime = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "b13d25230d34bbb65ba657be906fd59151a201f7" }
# The endpoint component's transport hosts, at the revs polymorph-iroh pins.
wasmtime-websocket = { git = "https://github.com/polymorph-components/polymorph-websocket", rev = "0278c0e9dfc13357b4b6d23a20a9b50d8176f51e" }
wasmtime-webrtc-datachannels = { git = "https://github.com/polymorph-components/polymorph-webrtc-datachannels", rev = "13ddd6b4289e2503cb41fa7680758f2e3ddb08a8" }
hex = "0.4"
# The act rig's storage egress: the origin-confined HTTP seam the guest's
# `store-owner-fetch` / `store-public-fetch` imports are wired to. rustls
# only — no native-tls, so the rig has no system-trust-store dependency.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# The escrowed SigV4 signing credential lives here, behind `store-signer`.
hmac = "0.12"
sha2 = "0.10"
# The resume battery's checkpoint surgery: the acts damage a member and
# re-seal the manifest, which means computing the same BLAKE3 the guest's
# persist.rs computes. Same major as the guest's pin.
blake3 = "1.5"
