[package]
name = "engine-guest"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keyhive, pinned to main as of 2026-08-16 (post-#213).
keyhive_core = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }
keyhive_crypto = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }
beekem = { git = "https://github.com/inkandswitch/keyhive", rev = "efe6ccf3ad67904b2f3b77385b1c754f9cd0f9d9" }

# Subduction, pinned to main as of 2026-08-13.
subduction_core = { git = "https://github.com/inkandswitch/subduction", rev = "2401102882b97d6b13c559fbbcfc2257e3a46dd3", features = ["std"] }
subduction_crypto = { git = "https://github.com/inkandswitch/subduction", rev = "2401102882b97d6b13c559fbbcfc2257e3a46dd3", features = ["std"] }
sedimentree_core = { git = "https://github.com/inkandswitch/subduction", rev = "2401102882b97d6b13c559fbbcfc2257e3a46dd3", features = ["std"] }
subduction_keyhive = { git = "https://github.com/inkandswitch/subduction", rev = "2401102882b97d6b13c559fbbcfc2257e3a46dd3", features = ["serde", "handler"] }

# The content layer, at the version subduction's own workspace pins.
automerge = "0.11.0"

# polymorph:webcrypto guest bindings (identity signing via platform handle).
polymorph-webcrypto-guest = { git = "https://github.com/polymorph-components/polymorph-webcrypto", rev = "b13d25230d34bbb65ba657be906fd59151a201f7" }

# Must match polymorph-webcrypto-guest's wit-bindgen minor so the two
# generate! expansions share one runtime. inter-task-wakeup is load-bearing:
# subduction's tasks sleep on Rust-side channels.
wit-bindgen = { version = "0.59", features = ["async", "async-spawn", "inter-task-wakeup"] }

# The storage providers, extracted (protocol only; no keyhive,
# subduction or automerge reaches them).
provider-common = { path = "../../providers/common" }
provider-s3 = { path = "../../providers/s3/store" }
provider-dropbox = { path = "../../providers/dropbox/store" }
provider-gdrive = { path = "../../providers/gdrive/store" }

future_form = "0.3.1"
futures = { version = "0.3", default-features = false, features = ["async-await", "std"] }
serde = { version = "1", features = ["derive"] }
# The identity bundle's passphrase keyslot (the downloadable-file wrap).
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
async-channel = "2"
async-lock = "3"
ed25519-dalek = "2.1"
rand = "0.8.5"
bincode = "1.3"
blake3 = "1.5"
# The pairing code's typed alphabet: BASE32_NOPAD_VISUAL is base32 with
# confusable characters translated on decode (PAIRING.md §1).
data-encoding = "2"
nonempty = { version = "0.10", features = ["serialize"] }
hex = "0.4"
# Dropbox provider: JSON request/response bodies (auth headers are the
# wired egress instance's business, not the guest's).
serde_json = "1"
