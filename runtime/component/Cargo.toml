[package]
name = "polyvisor-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# cdylib: this crate exists only to be a wasm component. All of its logic
# lives in `polyvisor-kernel`, which is a normal lib and tested natively.
crate-type = ["cdylib"]

[dependencies]
polyvisor-kernel = { path = "../crates/kernel" }
polyvisor-contacts-model = { path = "../crates/contacts-model" }
wit-bindgen.workspace = true
futures.workspace = true
