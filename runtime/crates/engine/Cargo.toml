[package]
name = "polyvisor-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# No WIT, no wasm: the engine is plain Rust over `EngineTransport`,
# `EngineClock` and a spawn callback, so all of it is testable natively on a
# `LocalPool` (docs/design.md "Delivery").
[dependencies]
automerge.workspace = true
ed25519-dalek.workspace = true
future_form.workspace = true
futures.workspace = true
sedimentree_core.workspace = true
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
subduction_crypto.workspace = true
subduction_protocol.workspace = true
subduction_runtime.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
future_form.workspace = true
