[package]
name = "polyvisor-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# No WIT, no wasm: the kernel is plain Rust over the `Platform`/`Files`/
# `Locks`/`Clock`/`Fetch`/`Rng` seams so all of it is testable natively
# (docs/design.md "Delivery").
[dependencies]
aes-gcm.workspace = true
argon2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
