[package]
name = "polyvisor-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# No WIT, no wasm: the kernel is plain Rust over the `Platform`/`Files`/
# `Locks`/`Clock`/`Fetch`/`Rng` seams so all of it is testable natively
# (docs/design.md "Delivery").
[dependencies]
aes-gcm.workspace = true
blake3.workspace = true
data-encoding.workspace = true
hmac.workspace = true
polyvisor-engine = { path = "../engine" }
polyvisor-contacts-model = { path = "../contacts-model" }
polyvisor-document-history = { path = "../document-history" }
polyvisor-petname.workspace = true
polyvisor-todo-model = { path = "../todo-model" }
polyvisor-visor-model = { path = "../visor-model" }
futures.workspace = true
ed25519-dalek.workspace = true
subduction_protocol.workspace = true
argon2.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
automerge.workspace = true
futures = { workspace = true, features = ["executor"] }
sedimentree_core.workspace = true
