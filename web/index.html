<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>polyvisor</title>
    <!-- No <meta http-equiv="Content-Security-Policy"> here on purpose. The
         home origin's policy is a HEADER the origin serves, and pinning it
         at the document instead would be a weaker copy that the static e2e
         server cannot deliver anyway; serving the real header is a later
         milestone. The frame's CSP is a different thing entirely and IS
         pinned, in the srcdoc web/boot.ts builds. -->
    <style>
    html, body { margin: 0; }
    body {
      /* `dvh` (dynamic viewport height) instead of an inherited `100%`: the
         app zone below the strip should follow the viewport the browser is
         currently giving the page, including as its own toolbar shows or
         hides, not a size fixed at load. See #visor-drawer in visor/src/style.rs
         for the matching `svh` reasoning on the drawer. */
      height: 100dvh;
      display: flex;
      flex-direction: column;
      font: 16px/1.4 system-ui, sans-serif;
    }
    /* The visor sits at the top, where browsers put their own trusted UI,
       and out of thumb range on a handheld — app interactions are the
       common case. */
    #visor {
      flex: 0 0 auto;
    }
    /* The app zone fills everything below the visor. Frames are the only
       thing that ever goes in it. */
    #app-zone {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    #app-zone iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    </style>
  </head>
  <body>
    <div id="visor"></div>
    <div id="app-zone"></div>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
