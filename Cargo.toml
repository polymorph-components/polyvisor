[workspace]
resolver = "3"
members = [
    "runtime/component",
    "runtime/crates/engine",
    "runtime/crates/kernel",
    "visor",
    "apps/todomvc",
    # Not shipped by the production site build: `web/build.ts --fixtures`
    # only.
    "apps/hostile",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# docs/design.md "Devices": sealing is pure Rust in the kernel with the key
# as bytes. `aes-gcm` is the checkpoint/DEK-wrap AEAD, `argon2` the Argon2id
# KEK derivation behind a passphrase. Both with default features off: the
# `getrandom` default would pull a second randomness source into a component
# that already has one seam for it (`Rng` over `wasi:random`), and
# `password-hash` (PHC strings) is unused — the kernel stores its own
# parameter record.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
# docs/design.md "Sync engine: subduction sans-IO": the engine drives
# `subduction_protocol`'s sans-IO node through `subduction_runtime`'s
# capability traits in their single-threaded `Local` form. Pinned to the
# `sansio` branch by full sha — unreleased and moving, so a rev bump is its
# own PR. `default-features = false` + `std`: the crates are `no_std`-first
# and gate `thiserror`/`ed25519-dalek` std behind that one feature.
#
# `sedimentree_core` and `subduction_crypto` live under `legacy/` in that
# workspace but are *not* legacy code: they are the shared data model and
# signature envelope the sans-IO crates are built on, and the sansio crates
# depend on them by path. The legacy crates we must not touch are the old
# runtime ones (`subduction_core`, `subduction_iroh`, ...).
subduction_protocol = { git = "https://github.com/inkandswitch/subduction", rev = "8b5aa2e43557a56a121b9748a10512aed5ca4f90", default-features = false, features = ["std"] }
subduction_runtime = { git = "https://github.com/inkandswitch/subduction", rev = "8b5aa2e43557a56a121b9748a10512aed5ca4f90", default-features = false }
subduction_crypto = { git = "https://github.com/inkandswitch/subduction", rev = "8b5aa2e43557a56a121b9748a10512aed5ca4f90", default-features = false, features = ["std"] }
sedimentree_core = { git = "https://github.com/inkandswitch/subduction", rev = "8b5aa2e43557a56a121b9748a10512aed5ca4f90", default-features = false, features = ["std"] }
# The tagless-final future kind subduction's traits are generic in. The
# engine is `Local` everywhere: one SharedWorker, nothing is `Send`.
# Version must match subduction's own pin or the trait is a different trait.
future_form = "0.3.0"
# docs/design.md "Sync engine": `tasks` is an automerge document from the
# start — one local mutation is one automerge change, carried as one
# sedimentree commit. Version matches subduction's own automerge pin so the
# ChangeHash/CommitId correspondence stays byte-identical across peers.
automerge = "0.11.0"
# The engine's signing identity (internal.wit `world runtime`: the seed
# posture). Same major as subduction's, so `Signature`/`VerifyingKey` unify
# across the trait boundary. `default-features = false` keeps `getrandom`
# and `rand_core` out: the seed comes from the kernel's `Rng` seam.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std"] }
# `LocalBoxFuture` (the shape of every seam future the kernel and engine
# exchange) and, in tests, `LocalPool` — the single-threaded executor
# subduction's own e2e tests drive their drivers with.
futures = { version = "0.3.31", default-features = false, features = ["alloc", "async-await"] }
# docs/design.md "Pins, with reasons": must equal stream-dom's pin —
# StreamReader<u8> (a wit-bindgen runtime type) crosses the delegation from
# our world's `run` into `stream_dom_dioxus::driver::run`; different
# wit-bindgen versions cannot coexist across a shared runtime type. Bumps
# follow stream-dom's.
wit-bindgen = { version = "=0.60.0", features = ["async-spawn", "inter-task-wakeup"] }
# docs/design.md "Pins, with reasons": dioxus-core state is shared with
# stream-dom-dioxus; skew breaks the build. This feature set compiles for a
# lib crate, so `html` is kept rather than dropped to the minimal set.
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "signals", "html"] }
# docs/design.md "Pins, with reasons": unpublished, moving; policy object
# and asset handles landed in #15. Full 40-char sha of origin/main at the
# time this skeleton was cut.
stream-dom-dioxus = { git = "https://github.com/polymorph-components/polymorph-stream-dom", rev = "197492374936b3b4ce5af55f2bac50fa6b551597" }
stream-dom-guest = { git = "https://github.com/polymorph-components/polymorph-stream-dom", rev = "197492374936b3b4ce5af55f2bac50fa6b551597" }
# The pairing code's alphabet (PAIRING.md §1): `BASE32_NOPAD_VISUAL` is the
# confusable-free base32 variant, which is what makes a 79-character code
# something a person can read off one screen and type into another.
# `default-features = false` + `alloc`: the `std` default buys only `Error`
# impls this never surfaces.
data-encoding = { version = "2.11", default-features = false, features = ["alloc"] }
# The pairing ceremony's hash (PAIRING.md §2): BLAKE3 for the nonce
# commitment and for the SAS transcript, byte-for-byte as the contract
# spells it. Not sha2 — the contract names BLAKE3 and two devices must
# derive the same six digits. `default-features = false` keeps it `no_std`
# and portable-Rust, so the wasm32-wasip2 build needs no C toolchain.
blake3 = { version = "1.8", default-features = false }
# docs/design.md Milestones M3c: every app-tree commit blob crosses the wire
# and rests in storage as a keyhive envelope, so a relay or a store holds
# ciphertext only. Pinned by full sha (unreleased, moving) at the rev the
# design was written against. All three crates are pure Rust — ed25519-dalek,
# x25519-dalek, chacha20poly1305, blake3 — so the wasm32-wasip2 build needs no
# host crypto import beyond the randomness the engine already seeds itself
# with. `beekem` is a direct dependency for one type: `EncryptedContent`, the
# envelope the engine serializes into a sedimentree blob.
keyhive_core = { git = "https://github.com/inkandswitch/keyhive", rev = "a509a2d32a57b9be1576d4f84864e743ecdf8c47" }
keyhive_crypto = { git = "https://github.com/inkandswitch/keyhive", rev = "a509a2d32a57b9be1576d4f84864e743ecdf8c47" }
beekem = { git = "https://github.com/inkandswitch/keyhive", rev = "a509a2d32a57b9be1576d4f84864e743ecdf8c47" }
# The codec keyhive's own archive/event types are meant to be carried in
# (`Archive`, `StaticEvent`, `EncryptedContent` all derive serde and keyhive's
# tests round-trip them through bincode). Version 1: keyhive's own pin.
bincode = "1.3"
# keyhive is generic in a `rand::CryptoRng`, and this is the one the engine
# gives it: a ChaCha20 stream seeded from the device seed and this boot's fresh
# entropy, rather than `rand`'s `OsRng`. `getrandom`'s wasi backend would be a
# second randomness source in a component that already has one seam for it, and
# the engine is handed fresh entropy at every start for exactly this reason
# (see `Engine::new`). `default-features = false` keeps `getrandom` out
# entirely, which is also why `rand` itself is not a dependency here.
rand_chacha = { version = "0.3", default-features = false }
# keyhive's `NonEmpty` argument type (`generate_doc`'s initial content heads).
# Version matches keyhive's own pin, or it is a different type.
nonempty = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
