<!doctype html>
<!-- The sandboxed UI frame's TEMPLATE (#16's architecture, #5's
     zero-network frame). This file is never navigated to: the visor
     fetches it as text, inlines ./todomvc-app.css and ./frame.js into
     it, and hands the result to the iframe as `srcdoc`
     (../../visor/frame/frame-backend.ts). One document per app surface:
     the guest's DOM is applied HERE, in a realm the shell cannot be
     reached from and which cannot reach the shell — the iframe is
     created WITHOUT `allow-same-origin`, so this document runs on an
     opaque origin. The visor's strip colour, its CSS custom properties,
     its classes and its storage are structurally out of reach rather
     than merely un-allowlisted.

     WHY srcdoc RATHER THAN A REAL URL (#142, measured in both engines).
     A service worker never sees a sandboxed frame's navigation, so a
     real-URL skeleton is served raw by the origin — outside the release
     integrity path (#3), with whatever headers the host happens to
     send, unpinnable. `srcdoc` content is pinned BY VALUE: every byte
     comes from the visor's own bundle-fetched assets.

     WHY THE POLICY IS NOT WRITTEN HERE. The frame's real policy is a
     <meta http-equiv="Content-Security-Policy"> that the backend
     inserts as the first thing in this document's head, because its
     `script-src` is a sha256 hash of the bundled ./frame.js text, which
     only exists at runtime. CSP policies COMPOSE — every policy must
     pass — so that meta's `default-src 'none'` makes this frame
     network-dead no matter what the visor's own inherited policy allows
     (#142: zero requests leave the frame; the meta-less control leaked
     three). `img-src data:` is in it because TodoMVC's stylesheet uses
     data-URL SVG glyphs. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>surface</title>
  <link rel="stylesheet" href="./todomvc-app.css">
  <style>
    /* OPAQUE background, on purpose. If the surface rectangle composited
       with the visor's pixels (transparency, blend modes, backdrop-filter),
       an app could read the visor's personal colour back out by sampling
       what shows through. An opaque backdrop leaves blend-based sampling
       nothing to read. Same reason the frame carries no transparency of
       its own on the shell side (border: none, no mix-blend-mode). */
    html, body { background: #f5f5f5; }
    body { margin: 0;
           font: 14px 'Helvetica Neue', Helvetica, Arial, sans-serif;
           color: #111; }
    /* The applier's container is <body> itself (ROOT_ID). */
    .todoapp { margin: 0; }
    /* TodoMVC's <h1> is absolutely positioned ABOVE its box; in the visor's
       document it overhung the pane, here it would be clipped at the
       frame's top edge. Reserve exactly its height, and only when a
       todoapp is present (panels get no dead space). */
    body:has(.todoapp) { padding-top: 44px; }
    .todoapp h1 { font-size: 40px; top: -40px; }
    .new-todo, .edit { font-size: 18px; }
    .todo-list li { font-size: 18px; }
  
    /* Coarse theme only (see frame.ts): generic surface colours for
       components rendered inside a dark shell. Nothing here encodes
       the visor's identity colour. */
    html[data-theme="dark"] body { background: #0f1424; color: #ddd; }
    html[data-theme="dark"] input { background: #16213e; color: #eee;
                                    border: 1px solid #2a2a44; padding: .25em .4em; }
    html[data-theme="dark"] button { background: #1a1a2e; color: #ddd;
                                     border: 1px solid #3d5a99; padding: .25em .7em; }
    html[data-theme="dark"] label { display: block; margin: .35em 0 .15em; font-size: 12px; }
    html[data-theme="dark"] .status { font-size: 12px; color: #f5c16c; min-height: 1.2em; }
  </style>
</head>
<!-- No inline event handlers anywhere: every listener is attached by the
     applier, from script. -->
<body>
  <script type="module" src="./frame.js"></script>
</body>
</html>
